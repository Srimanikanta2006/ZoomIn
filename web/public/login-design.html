  <script>
    (function(){
      var REF_W=1464, REF_H=949, PHOTO_W=836, PANE_W=628, CARD_W=613, CARD_H=922;
      var CONTENT_H=697;
      var IMG_W=1177, IMG_H=1336, IMG_REF_SCALE=836/1177;
      var PANE_RATIO=PANE_W/REF_W;
      var HERO_W=681, HERO_H=219;
      var photoEl = document.getElementById('photo');
      var paneEl = document.getElementById('pane');
      var cardEl = document.getElementById('card');
      var cardIn = document.getElementById('cardIn');
      var heroEl = document.getElementById('hero');

      function clearInline() {
        if (photoEl) photoEl.style.cssText = '';
        if (paneEl) paneEl.style.cssText = '';
        if (cardEl) cardEl.style.cssText = '';
        if (cardIn) cardIn.style.cssText = '';
        if (heroEl) heroEl.style.cssText = '';
      }

      function photoRatio(vw) {
        if (vw >= 1280) return 1 - PANE_RATIO;
        if (vw >= 1000) return 0.42 + (vw - 1000)/(1280 - 1000) * ((1 - PANE_RATIO) - 0.42);
        return 0.36 + (vw - 820)/(1000 - 820) * (0.42 - 0.36);
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw < 700) {
          document.body.className = 'stacked';
          clearInline();
          return;
        }

        if (vw / vh < 51/50) {
          document.body.className = 'tabport';
          clearInline();
          var bandH = Math.round(vh * 0.425);
          document.documentElement.style.setProperty('--band-h', bandH + 'px');
          return;
        }

        document.body.className = '';
        clearInline();

        var pr = photoRatio(vw);
        var pw = Math.round(vw * pr);
        var paneW = vw - pw;
        photoEl.style.width = pw + 'px';
        paneEl.style.left = pw + 'px';

        var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
        var gapL = 1 * cs, mT = 14 * cs, mB = 13 * cs, mR = 14 * cs;
        var cw = Math.max(CARD_W * cs, paneW - gapL - mR);
        var ch = vh - mT - mB;
        cardEl.style.width = cw + 'px';
        cardEl.style.height = ch + 'px';
        cardEl.style.top = mT + 'px';
        cardEl.style.left = gapL + 'px';
        cardEl.style.borderRadius = (26 * cs) + 'px';

        cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';

        var imgScale = Math.max(pw / IMG_W, vh / IMG_H);
        var s = Math.min(imgScale / IMG_REF_SCALE, pw * 0.92 / HERO_W);
        heroEl.style.transform = 'scale(' + s + ')';
        heroEl.style.bottom = '0px';
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout);
      layout();

      // Entrance animation
      function releaseEntrance() {
        document.documentElement.classList.remove('entry-pending');
        if (window.__entryFallback) clearTimeout(window.__entryFallback);
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) {
        releaseEntrance();
      } else {
        var ease = 'cubic-bezier(.16,1,.3,1)';
        var softEase = 'cubic-bezier(.22,1,.36,1)';
        var compact = window.matchMedia('(max-width:699px)').matches;

        var anims = [
          { el: cardEl, d: 40, dur: 820, e: ease, from: { opacity: 0, transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)' } },
          { el: document.getElementById('badge'), d: 120, dur: 480, e: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
          { el: document.getElementById('hl1'), d: 240, dur: 760, e: ease, from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' } },
          { el: document.getElementById('hl2'), d: 330, dur: 760, e: ease, from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' } },
          { el: document.getElementById('h1'), d: 470, dur: 620, e: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
          { el: document.getElementById('sub'), d: 570, dur: 560, e: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
          { el: document.getElementById('email'), d: 720, dur: 520, e: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
          { el: document.getElementById('pw'), d: 790, dur: 520, e: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
          { el: document.getElementById('loginBtn'), d: 930, dur: 560, e: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
          { el: document.querySelector('.divider'), d: 1060, dur: 440, e: softEase, from: { opacity: 0, transform: 'translateY(6px)' } },
          { el: document.getElementById('gBtn'), d: 1150, dur: 540, e: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
          { el: document.getElementById('bottom'), d: 1260, dur: 500, e: softEase, from: { opacity: 0, transform: 'translateY(6px)' } },
        ];

        var runAnimations = anims.filter(function(a){ return !!a.el; }).map(function(a){
          return a.el.animate([
            a.from,
            { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
          ], { delay: a.d, duration: a.dur, easing: a.e, fill: 'both' });
        });

        document.documentElement.classList.remove('entry-pending');
        Promise.allSettled(runAnimations.map(function(a){ return a.finished; })).then(function(){
          runAnimations.forEach(function(a){ a.cancel(); });
          releaseEntrance();
        });
      }
    })();
  </script>
</body>
